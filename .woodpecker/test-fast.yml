# PR and main validation. No publishing, deployment credentials or production services.

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main
  - event: deployment
    branch: main
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "build-release"'

variables:
  - &ci_python_image registry.techize.co.uk/batchivo/ci-python:3.12
  - &node_image registry.techize.co.uk/dockerhub-cache/node@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd
  - &trivy_image registry.techize.co.uk/dockerhub-cache/aquasec/trivy:0.55.0

services:
  postgres:
    image: registry.techize.co.uk/dockerhub-cache/postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_batchivo

steps:
  scan-deps-backend:
    image: *trivy_image
    commands:
      - trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --scanners vuln backend/
      - echo "Backend dependency scan complete"

  scan-deps-frontend:
    image: *trivy_image
    commands:
      - trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --scanners vuln frontend/
      - echo "Frontend dependency scan complete"

  # ============================================
  # Backend: Lint + Unit Tests (~3-5 min)
  # Includes database-backed unit fixtures in an ephemeral PostgreSQL service.
  # ============================================
  backend-unit:
    image: *ci_python_image
    depends_on: []
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/test_batchivo
      SECRET_KEY: test-secret-key-for-ci-testing-minimum-32-chars
    commands:
      - cd backend
      - command -v poetry || pip install --quiet --no-cache-dir poetry
      - poetry install --no-interaction --quiet --extras dev --no-root
      - echo "=== Lint ==="
      - poetry run ruff check .
      - poetry run ruff format --check .
      - echo "=== Unit tests ==="
      - timeout 60 sh -c 'until pg_isready -h postgres -U test -q; do sleep 1; done'
      - poetry run pytest tests/unit/ --tb=short -q

  # ============================================
  # Frontend: Lint + Type Check + Unit Tests (~3-5 min)
  # ============================================
  frontend:
    image: *node_image
    depends_on: []
    commands:
      - cd frontend
      - npm ci --silent
      - npm run lint
      - npm run typecheck
      - npm run test:ci
      - npm run build:check

# Owner-triggered image publishing, after all validation succeeds.
# Promotion uses a separate manifest PR; this workflow never edits live manifests.

when:
  - event: deployment
    branch: main
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "build-release"'

depends_on:
  - test-fast
  - test-integration

steps:
  # ============================================
  # Build Docker Images (parallel)
  #
  # Uses buildctl to send builds directly to the BuildKit daemon at
  # buildkitd.woodpecker.svc:1234. No Docker socket or privileged mode needed.
  # Layer cache is stored in the daemon's 20Gi PVC — code-only changes skip
  # the heavy dependency layers entirely (poetry install, npm ci).
  # ============================================
  build-backend:
    image: registry.techize.co.uk/dockerhub-cache/moby/buildkit:latest
    environment:
      REGISTRY_USERNAME:
        from_secret: docker_username
      REGISTRY_PASSWORD:
        from_secret: docker_password
    commands:
      - mkdir -p /root/.docker
      - printf '{"auths":{"registry.techize.co.uk":{"auth":"%s"}}}' "$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /root/.docker/config.json
      - |
        buildctl --addr tcp://buildkitd.woodpecker.svc:1234 build \
          --frontend=dockerfile.v0 \
          --opt filename=Dockerfile \
          --local context=backend \
          --local dockerfile=backend \
          --import-cache type=registry,ref=registry.techize.co.uk/batchivo/batchivo-backend-cache \
          --export-cache type=registry,ref=registry.techize.co.uk/batchivo/batchivo-backend-cache,mode=max \
          --output type=image,name=registry.techize.co.uk/batchivo/batchivo-backend:${CI_COMMIT_SHA},push=true

  build-frontend:
    image: registry.techize.co.uk/dockerhub-cache/moby/buildkit:latest
    environment:
      REGISTRY_USERNAME:
        from_secret: docker_username
      REGISTRY_PASSWORD:
        from_secret: docker_password
    commands:
      - mkdir -p /root/.docker
      - printf '{"auths":{"registry.techize.co.uk":{"auth":"%s"}}}' "$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /root/.docker/config.json
      - |
        buildctl --addr tcp://buildkitd.woodpecker.svc:1234 build \
          --frontend=dockerfile.v0 \
          --opt filename=Dockerfile \
          --opt build-arg:VITE_API_URL=https://api.batchivo.com \
          --local context=frontend \
          --local dockerfile=frontend \
          --import-cache type=registry,ref=registry.techize.co.uk/batchivo/batchivo-frontend-cache \
          --export-cache type=registry,ref=registry.techize.co.uk/batchivo/batchivo-frontend-cache,mode=max \
          --output type=image,name=registry.techize.co.uk/batchivo/batchivo-frontend:${CI_COMMIT_SHA},push=true

  scan-image-backend:
    image: registry.techize.co.uk/dockerhub-cache/aquasec/trivy:0.55.0
    depends_on: [build-backend]
    environment:
      TRIVY_USERNAME:
        from_secret: docker_username
      TRIVY_PASSWORD:
        from_secret: docker_password
    commands:
      - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed registry.techize.co.uk/batchivo/batchivo-backend:${CI_COMMIT_SHA}

  scan-image-frontend:
    image: registry.techize.co.uk/dockerhub-cache/aquasec/trivy:0.55.0
    depends_on: [build-frontend]
    environment:
      TRIVY_USERNAME:
        from_secret: docker_username
      TRIVY_PASSWORD:
        from_secret: docker_password
    commands:
      - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed registry.techize.co.uk/batchivo/batchivo-frontend:${CI_COMMIT_SHA}
